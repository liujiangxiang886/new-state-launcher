[pytest]
# 仓库里的 19 个真实包回归不叫 test_*（它是「跑一遍真实数据」而不是单元断言），
# 所以显式把 regression_*.py 也纳入收集，否则 `pytest tests/` 会静默跳过它。
python_files = test_*.py regression_*.py

# 需要**真实** builds/ packs/ cache/ 的用例打这个标记，退出默认隔离。
#
# 默认行为（conftest 的 ``_isolate_runtime_dirs``）是每个用例都跑在临时目录上：
# 曾经因为没隔离，跑一轮测试就把真实的已装扩展清单（config/extensions.json）
# 覆盖成 2 条测试数据，真实 packs/ 里也堆了 30+ 个测试包。详见 conftest 注释。
markers =
    real_dirs: 使用真实运行期目录（builds/packs/cache），不套临时隔离

# 临时目录保留策略：只留失败那一轮的现场，通过的用例跑完就删。
#
# 这里曾经踩过一个坑，改之前务必看明白：
# 宿主（WorkBuddy CLI）的 sitecustomize 会给 shutil.rmtree 套一层壳，
# 「本轮累计删除满 50 次就 raise SystemExit(1) 要求确认」。而本策略会为
# **每个通过的用例**删一次 tmp_path —— 一轮 740+ 个用例，删到第 50 个就撞钩子，
# 报成 ``ERROR at teardown of xxx - SystemExit: 1``，随后会话被打崩，
# 最后 ``INTERNALERROR ValueError: ... is not in the subpath of ...``。
#
# 那不是产品缺陷，是壳在拦。所以 ``tests/conftest.py`` 的
# ``_restore_stock_delete()`` 会在 pytest 进程内把删除函数换回标准库原版
# （报告头会打印 ``safe-delete: 已还原标准库删除语义：...`` 以示生效）。
# 壳还原之后本策略才能安全使用 —— 它也是这里最省事的：
# 通过的用例立刻释放空间，一轮下来临时目录基本不涨。
tmp_path_retention_policy = failed

# 保留最近 2 轮（含失败用例的现场），再多就删旧的。
tmp_path_retention_count = 2
